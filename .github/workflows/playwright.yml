name: Catawiki Automation

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # Run daily at 06:00 UTC
    - cron: '0 6 * * *'

  workflow_dispatch:

jobs:
  smoke:
    name: Smoke Tests (critical path)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps firefox
      - name: Run smoke tests
        run: npx playwright test --grep @smoke
        env:
          CI: true
          BASE_URL: ${{ vars.BASE_URL || 'https://www.catawiki.com' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-report
          path: playwright-report/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-allure-results
          path: allure-results/
          retention-days: 14

  sanity:
    name: Sanity Tests (page health + API)
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps firefox
      - name: Run sanity tests
        run: npx playwright test --grep @sanity
        env:
          CI: true
          BASE_URL: ${{ vars.BASE_URL || 'https://www.catawiki.com' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sanity-report
          path: playwright-report/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sanity-allure-results
          path: allure-results/
          retention-days: 14

  regression:
    name: Regression Tests (full coverage)
    needs: sanity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps firefox
      - name: Run regression tests
        run: npx playwright test --grep @regression
        env:
          CI: true
          BASE_URL: ${{ vars.BASE_URL || 'https://www.catawiki.com' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regression-report
          path: playwright-report/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regression-allure-results
          path: allure-results/
          retention-days: 14

  a11y:
    name: Accessibility Audit
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps firefox
      - name: Run accessibility tests
        run: npx playwright test --grep @a11y
        env:
          CI: true
          BASE_URL: ${{ vars.BASE_URL || 'https://www.catawiki.com' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a11y-report
          path: playwright-report/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a11y-allure-results
          path: allure-results/
          retention-days: 14

  auth:
    name: Authenticated Flows (staging only)
    needs: sanity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ vars.CATAWIKI_EMAIL != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps firefox
      - name: Run authenticated tests
        run: npx playwright test --grep @auth
        env:
          CI: true
          BASE_URL: ${{ vars.BASE_URL || 'https://www.catawiki.com' }}
          CATAWIKI_EMAIL: ${{ secrets.CATAWIKI_EMAIL }}
          CATAWIKI_PASSWORD: ${{ secrets.CATAWIKI_PASSWORD }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: auth-report
          path: playwright-report/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: auth-allure-results
          path: allure-results/
          retention-days: 14

  allure-report:
    name: Publish Allure Report
    needs: [regression, a11y]
    if: always() && (needs.regression.result == 'success' || needs.regression.result == 'failure') && (needs.a11y.result == 'success' || needs.a11y.result == 'failure')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Download Allure results
        uses: actions/download-artifact@v4
        with:
          pattern: '*-allure-results'
          path: allure-results
          merge-multiple: true

      - name: Setup Node for Allure CLI
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate Allure report
        run: |
          npm install -g allure-commandline
          allure generate allure-results -o allure-report --clean

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report

  deploy-pages:
    name: Deploy to GitHub Pages
    needs: allure-report
    if: always() && needs.allure-report.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
